<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectare - EcoScut Moldova</title>
    <link rel="stylesheet" href="conectare.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
     <div class="login-wrapper">
        <div class="login-left">
            <div class="login-header">
                <a href="ecoscutacasa.html" class="back-link">← Înapoi la site</a>
                <img src="img.png.png" alt="Logo" class="login-logo">
                <h1>Bine ai revenit!</h1>
                <p>Introdu datele tale pentru a gestiona rapoartele și evenimentele.</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="nume@exemplu.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Parolă</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> <span>Ține-mă minte</span>
                    </label>
                    <a href="#" class="forgot-pass">Ai uitat parola?</a>
                </div>

                <button type="submit" class="btn-login">Intră în cont</button>
            </form>

            <div class="login-footer">
                <p>Nu ai un cont?<a href="https://forms.gle/34repiQS8SW3SNEm9" target="_blank" class="btn-participa"> Înregistrează-te ca voluntar</a>
            </div>
        </div>

        <div class="login-right">
            <div class="overlay-text">
                <h2>"Natura nu este un loc de vizitat. Este acasă."</h2>
                <p>Alătură-te comunității EcoScut și protejează peisajele de la Nistru până la Prut.</p>
            </div>
        </div>
    </div>
    <script src="ecoscut.js"></script>
</body>
</html>
